<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="sunb" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#cfab5e"/>
      <stop offset="100%" stop-color="#c2a055"/>
    </radialGradient>
    <linearGradient id="skyb" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f2ede3"/>
      <stop offset="100%" stop-color="#eae2d1"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="900" fill="url(#skyb)"/>

  <circle cx="215" cy="200" r="105" fill="url(#sunb)" opacity="0.9"/>

  <!-- teren -->
  <line x1="0" y1="640" x2="1200" y2="640" stroke="#1a1713" stroke-width="2.5"/>

  <!-- kuća: prizemlje + kat -->
  <g stroke="#1a1713" stroke-width="3.5" stroke-linejoin="round">
    <!-- kat -->
    <rect x="380" y="300" width="440" height="160" fill="#d9cdb4"/>
    <!-- krovna ploča -->
    <rect x="362" y="282" width="476" height="20" fill="#1a1713"/>
    <!-- prizemlje -->
    <rect x="380" y="462" width="440" height="178" fill="#e3dac7"/>
    <!-- prozori kata -->
    <rect x="425" y="336" width="105" height="66" fill="#f2ede3"/>
    <rect x="595" y="336" width="105" height="66" fill="#f2ede3"/>
    <!-- lođa kata -->
    <rect x="735" y="336" width="52" height="124" fill="#c8b993"/>
    <!-- staklena stijena prizemlja -->
    <rect x="560" y="500" width="215" height="140" fill="#f2ede3"/>
    <line x1="668" y1="500" x2="668" y2="640" stroke-width="2.5"/>
    <!-- ulazna vrata -->
    <rect x="425" y="516" width="78" height="124" fill="#2a2620"/>
    <!-- natkrivena terasa -->
    <line x1="820" y1="462" x2="960" y2="462" stroke-width="10"/>
    <line x1="950" y1="462" x2="950" y2="640"/>
  </g>

  <!-- vrt -->
  <g stroke="#1a1713" stroke-width="2.5">
    <line x1="1035" y1="640" x2="1035" y2="566"/>
    <circle cx="1035" cy="540" r="40" fill="#b3ad91"/>
    <circle cx="145" cy="616" r="26" fill="#b3ad91"/>
    <circle cx="222" cy="622" r="20" fill="#b3ad91"/>
  </g>

  <!-- ograda slijepe ulice -->
  <g stroke="#1a1713" stroke-width="2" opacity="0.5">
    <line x1="60" y1="640" x2="60" y2="604"/>
    <line x1="100" y1="640" x2="100" y2="604"/>
    <line x1="60" y1="612" x2="100" y2="612"/>
  </g>

  <!-- kotirna linija -->
  <g stroke="#82683a" stroke-width="2">
    <line x1="380" y1="212" x2="820" y2="212"/>
    <line x1="380" y1="200" x2="380" y2="224"/>
    <line x1="820" y1="200" x2="820" y2="224"/>
  </g>
  <text x="600" y="196" font-family="Georgia, serif" font-size="30" fill="#82683a" text-anchor="middle">57,21 m²</text>

  <!-- šrafura -->
  <g stroke="#1a1713" stroke-width="1.5" opacity="0.35">
    <line x1="80" y1="658" x2="102" y2="642"/>
    <line x1="280" y1="658" x2="302" y2="642"/>
    <line x1="480" y1="658" x2="502" y2="642"/>
    <line x1="680" y1="658" x2="702" y2="642"/>
    <line x1="880" y1="658" x2="902" y2="642"/>
    <line x1="1080" y1="658" x2="1102" y2="642"/>
  </g>
</svg>
