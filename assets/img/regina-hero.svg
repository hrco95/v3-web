<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="sunr" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#cfab5e"/>
      <stop offset="100%" stop-color="#c2a055"/>
    </radialGradient>
    <linearGradient id="skyr" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f2ede3"/>
      <stop offset="100%" stop-color="#ebe4d3"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="900" fill="url(#skyr)"/>

  <!-- sunce nad morem -->
  <circle cx="280" cy="270" r="115" fill="url(#sunr)" opacity="0.9"/>

  <!-- more -->
  <rect x="0" y="520" width="1200" height="130" fill="#9fb0a8"/>
  <line x1="0" y1="520" x2="1200" y2="520" stroke="#1a1713" stroke-width="2.5"/>
  <g stroke="#f2ede3" stroke-width="2.5" opacity="0.7">
    <line x1="180" y1="560" x2="330" y2="560"/>
    <line x1="120" y1="596" x2="240" y2="596"/>
    <line x1="300" y1="620" x2="420" y2="620"/>
    <line x1="480" y1="575" x2="580" y2="575"/>
  </g>

  <!-- obala / teren raste prema zgradi -->
  <path d="M0 650 L1200 650 L1200 900 L0 900 Z" fill="#ddd3bd"/>
  <line x1="0" y1="650" x2="1200" y2="650" stroke="#1a1713" stroke-width="2.5"/>

  <!-- zgrada Regina: 3 etaže, balkoni prema moru (JZ) -->
  <g stroke="#1a1713" stroke-width="3.5" stroke-linejoin="round">
    <rect x="700" y="230" width="330" height="420" fill="#d9cdb4"/>
    <rect x="685" y="212" width="360" height="18" fill="#1a1713"/>
    <!-- etažne ploče -->
    <line x1="700" y1="370" x2="1030" y2="370" stroke-width="2.5"/>
    <line x1="700" y1="510" x2="1030" y2="510" stroke-width="2.5"/>
    <!-- balkoni prema moru -->
    <g fill="#1a1713">
      <rect x="628" y="356" width="72" height="10"/>
      <rect x="628" y="496" width="72" height="10"/>
      <rect x="628" y="636" width="72" height="10"/>
    </g>
    <g stroke-width="2" opacity="0.8">
      <line x1="634" y1="356" x2="634" y2="326"/>
      <line x1="666" y1="356" x2="666" y2="326"/>
      <line x1="700" y1="326" x2="634" y2="326"/>
      <line x1="634" y1="496" x2="634" y2="466"/>
      <line x1="666" y1="496" x2="666" y2="466"/>
      <line x1="700" y1="466" x2="634" y2="466"/>
      <line x1="634" y1="636" x2="634" y2="606"/>
      <line x1="666" y1="636" x2="666" y2="606"/>
      <line x1="700" y1="606" x2="634" y2="606"/>
    </g>
    <!-- prozori -->
    <g fill="#f2ede3">
      <rect x="742" y="266" width="86" height="60"/>
      <rect x="890" y="266" width="86" height="60"/>
      <rect x="742" y="406" width="86" height="60"/>
      <rect x="890" y="406" width="86" height="60"/>
      <rect x="742" y="546" width="86" height="60"/>
      <rect x="890" y="546" width="86" height="60"/>
    </g>
  </g>

  <!-- mediteransko drvo -->
  <g stroke="#1a1713" stroke-width="2.5">
    <line x1="1120" y1="650" x2="1120" y2="580"/>
    <circle cx="1120" cy="556" r="34" fill="#b3ad91"/>
    <line x1="580" y1="650" x2="580" y2="606"/>
    <circle cx="580" cy="588" r="24" fill="#b3ad91"/>
  </g>

  <!-- odsjaj sunca na moru -->
  <g stroke="#cfab5e" stroke-width="3" opacity="0.7">
    <line x1="250" y1="545" x2="310" y2="545"/>
    <line x1="266" y1="580" x2="316" y2="580"/>
    <line x1="240" y1="612" x2="282" y2="612"/>
  </g>

  <!-- kotirna linija -->
  <g stroke="#82683a" stroke-width="2">
    <line x1="700" y1="140" x2="1030" y2="140"/>
    <line x1="700" y1="128" x2="700" y2="152"/>
    <line x1="1030" y1="128" x2="1030" y2="152"/>
  </g>
  <text x="865" y="124" font-family="Georgia, serif" font-size="30" fill="#82683a" text-anchor="middle">6 × 57 m²</text>
</svg>
