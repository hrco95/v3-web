<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 686" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="sun" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#cfab5e"/>
      <stop offset="100%" stop-color="#c2a055"/>
    </radialGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f2ede3"/>
      <stop offset="100%" stop-color="#ece5d6"/>
    </linearGradient>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" result="n"/>
      <feColorMatrix in="n" type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.05"/></feComponentTransfer>
      <feComposite operator="over" in2="SourceGraphic"/>
    </filter>
  </defs>

  <rect width="1600" height="686" fill="url(#sky)"/>

  <!-- sunce -->
  <circle cx="1190" cy="215" r="140" fill="url(#sun)" opacity="0.9"/>

  <!-- linija terena -->
  <line x1="0" y1="520" x2="1600" y2="520" stroke="#1a1713" stroke-width="2.5"/>

  <!-- kuća (Bjelovar) -->
  <g stroke="#1a1713" stroke-width="3" stroke-linejoin="round">
    <rect x="235" y="392" width="330" height="128" fill="#e3dac7"/>
    <rect x="235" y="292" width="330" height="100" fill="#d9cdb4"/>
    <rect x="222" y="278" width="356" height="16" fill="#1a1713"/>
    <rect x="282" y="322" width="80" height="46" fill="#f2ede3"/>
    <rect x="438" y="322" width="80" height="46" fill="#f2ede3"/>
    <rect x="282" y="428" width="80" height="92" fill="#2a2620"/>
    <rect x="410" y="428" width="110" height="60" fill="#f2ede3"/>
  </g>

  <!-- zgrada (Regina) -->
  <g stroke="#1a1713" stroke-width="3" stroke-linejoin="round">
    <rect x="905" y="250" width="320" height="270" fill="#d9cdb4"/>
    <rect x="893" y="238" width="344" height="14" fill="#1a1713"/>
    <g fill="#f2ede3">
      <rect x="940" y="280" width="70" height="46"/>
      <rect x="1090" y="280" width="70" height="46"/>
      <rect x="940" y="370" width="70" height="46"/>
      <rect x="1090" y="370" width="70" height="46"/>
      <rect x="940" y="458" width="70" height="46"/>
      <rect x="1090" y="458" width="70" height="46"/>
    </g>
    <line x1="905" y1="340" x2="1225" y2="340" stroke-width="2"/>
    <line x1="905" y1="430" x2="1225" y2="430" stroke-width="2"/>
    <rect x="855" y="334" width="50" height="8" fill="#1a1713"/>
    <rect x="855" y="424" width="50" height="8" fill="#1a1713"/>
  </g>

  <!-- drveće -->
  <g stroke="#1a1713" stroke-width="2.5">
    <line x1="690" y1="520" x2="690" y2="452"/>
    <circle cx="690" cy="430" r="34" fill="#b3ad91"/>
    <line x1="1330" y1="520" x2="1330" y2="466"/>
    <circle cx="1330" cy="446" r="28" fill="#b3ad91"/>
    <line x1="130" y1="520" x2="130" y2="470"/>
    <circle cx="130" cy="452" r="26" fill="#b3ad91"/>
  </g>

  <!-- kotirna linija (svaki kvadrat vrijedi) -->
  <g stroke="#82683a" stroke-width="2">
    <line x1="235" y1="180" x2="565" y2="180"/>
    <line x1="235" y1="168" x2="235" y2="192"/>
    <line x1="565" y1="168" x2="565" y2="192"/>
  </g>
  <text x="400" y="164" font-family="Georgia, serif" font-size="26" fill="#82683a" text-anchor="middle">m²</text>

  <!-- šrafura terena -->
  <g stroke="#1a1713" stroke-width="1.5" opacity="0.35">
    <line x1="60" y1="536" x2="80" y2="522"/>
    <line x1="240" y1="536" x2="260" y2="522"/>
    <line x1="430" y1="536" x2="450" y2="522"/>
    <line x1="620" y1="536" x2="640" y2="522"/>
    <line x1="810" y1="536" x2="830" y2="522"/>
    <line x1="1000" y1="536" x2="1020" y2="522"/>
    <line x1="1190" y1="536" x2="1210" y2="522"/>
    <line x1="1380" y1="536" x2="1400" y2="522"/>
    <line x1="1540" y1="536" x2="1560" y2="522"/>
  </g>

  <rect width="1600" height="686" filter="url(#grain)" opacity="0.5" fill="transparent"/>
</svg>
